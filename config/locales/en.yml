  # Notes and messages
  text_multirdp_data_info: "This configuration belongs to the administrator. The client reads it but never writes it. Every change increments the revision; clients pick it up on their next sync."
  text_multirdp_grace_days_info: "Days the client may keep working with the last confirmed state while Redmine is unreachable."
  text_multirdp_port_info: "0 means 3389."
  text_multirdp_vpn_endpoint_info: "Display only. The key is stored per grant as the VPN configuration."
  text_multirdp_known_ids_info: "Comma separated; usually empty, the app learns them itself."
  text_multirdp_icon_info: "Square, at most 1024×1024 pixels, at most 256 KiB. Larger icons are rejected."
  text_multirdp_valid_until_info: "Leave empty for unlimited."
  text_multirdp_secret_info: "The WireGuard configuration contains the private key. It is stored encrypted and never shown here. Every fetch by a device is logged."
  text_multirdp_encryption_missing: "No encryption key configured (environment variable %{env} or file %{file}). VPN configurations cannot be stored or delivered."
  text_multirdp_approval_request: "%{name} (%{platform}, multiRDP %{version}) wants to use your license."
  text_multirdp_approval_requested: "Requested %{time} ago from %{ip}."
  text_multirdp_mail_device_requested: "The device \"%{name}\" (%{platform}, multiRDP %{version}) requested access to your multiRDP license from %{ip}."
  text_multirdp_mail_device_requested_hint: "Please approve or deny the request in Redmine under \"My account\" → \"Licenses\". It expires after %{minutes} minutes."
  mail_subject_multirdp_device_requested: "multiRDP: device \"%{name}\" requests approval"
  notice_multirdp_device_approved: "Device \"%{name}\" approved."
  notice_multirdp_device_denied: "Device \"%{name}\" denied."
  notice_multirdp_device_revoked: "Device \"%{name}\" revoked."
  notice_multirdp_grants_created:
    one: "1 grant issued."
    other: "%{count} grants issued."
  notice_multirdp_secret_stored: "VPN configuration stored."
  notice_multirdp_rdp_password_stored: "RDP password stored."
  error_multirdp_rdp_password_invalid: "The password is empty or longer than 255 bytes."
  text_multirdp_rdp_password_info: "Password of the RDP user account per server. Stored encrypted, never shown here, delivered only to approved devices; every fetch is logged. Leave empty if the user enters it on the device."
  error_multirdp_device_not_pending: "This request is no longer open (expired or already decided)."
  error_multirdp_unknown_server: "Unknown server."
  error_multirdp_secret_invalid: "The configuration is empty or too large (at most 64 KiB)."
  error_multirdp_encryption_unavailable: "No encryption key configured; the configuration was not stored."

