  # Hinweise und Meldungen
  text_multirdp_data_info: "Diese Vorgabe gehört dem Administrator. Der Client liest sie, schreibt sie aber nie. Jede Änderung erhöht die Fassung; die Clients bemerken das beim nächsten Abgleich."
  text_multirdp_grace_days_info: "Tage, die der Client ohne Verbindung zu Redmine mit dem zuletzt bestätigten Zustand weiterarbeiten darf."
  text_multirdp_port_info: "0 bedeutet 3389."
  text_multirdp_vpn_endpoint_info: "Nur zur Anzeige. Der Schlüssel wird je Zuteilung als VPN-Konfiguration hinterlegt."
  text_multirdp_known_ids_info: "Kommagetrennt; in der Regel leer, die App lernt sie selbst."
  text_multirdp_icon_info: "Quadratisch, höchstens 1024×1024 Pixel, höchstens 256 KiB. Größere werden abgewiesen."
  text_multirdp_valid_until_info: "Leer lassen für unbefristet."
  text_multirdp_secret_info: "Die WireGuard-Konfiguration enthält den privaten Schlüssel. Sie wird verschlüsselt gespeichert und hier nie angezeigt. Jeder Abruf durch ein Gerät wird protokolliert."
  text_multirdp_encryption_missing: "Kein Verschlüsselungsschlüssel konfiguriert (Umgebungsvariable %{env} oder Datei %{file}). VPN-Konfigurationen können nicht gespeichert oder ausgeliefert werden."
  text_multirdp_approval_request: "%{name} (%{platform}, multiRDP %{version}) möchte deine Lizenz verwenden."
  text_multirdp_approval_requested: "Angefragt vor %{time} von %{ip}."
  text_multirdp_mail_device_requested: "Das Gerät „%{name}“ (%{platform}, multiRDP %{version}) hat von %{ip} aus um Zugriff auf deine multiRDP-Lizenz gebeten."
  text_multirdp_mail_device_requested_hint: "Bitte gib die Anfrage in Redmine unter „Mein Konto“ → „Lizenzen“ frei oder lehne sie ab. Sie verfällt nach %{minutes} Minuten."
  mail_subject_multirdp_device_requested: "multiRDP: Gerät „%{name}“ bittet um Freigabe"
  notice_multirdp_device_approved: "Gerät „%{name}“ freigegeben."
